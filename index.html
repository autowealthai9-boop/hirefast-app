<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HireFast AI | Professional Resume Builder</title>
    <meta name="description" content="Build ATS-optimized resumes instantly with AI." />
    
    <!-- PWA & Theme -->
    <meta name="theme-color" content="#6366f1" />
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/9437/9437567.png" />
    
    <!-- IMPORTANT: When deploying to GH Pages, ensure you are using the contents of the 'dist' folder -->
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Script registration using relative path -->
    <!-- The line below is replaced by Vite during 'npm run build' with the correct .js file -->
    <script type="module" src="src/main.tsx"></script>

    <script>
      // Diagnostic script for GitHub Pages
      window.onerror = function(msg, url, line) {
        console.error("App Error: " + msg + " at " + url + ":" + line);
        return false;
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('HireFast Service Worker Registered'))
            .catch(err => console.error('SW Error:', err));
        });
      }
    </script>
  </body>
</html>
